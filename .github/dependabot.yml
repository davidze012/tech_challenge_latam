version: 2

# Weekly grouped PRs against `dev`, they go through CI and the staging deployment
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /infra/terraform
      - /infra/terraform/bootstrap
    target-branch: dev
    schedule:
      interval: weekly
    groups:
      terraform:
        patterns: ["*"]
